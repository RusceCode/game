<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sterrensprint</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Sterrensprint</h1>
      <p class="subtitle">Pak zoveel mogelijk sterren en ontwijk de rode asteroïden.</p>
      <section class="hud">
        <p>Score: <span id="score">0</span></p>
        <p>Levens: <span id="lives">3</span></p>
        <button id="restart" type="button">Opnieuw starten</button>
      </section>
      <canvas id="game" width="640" height="400" aria-label="Sterrensprint speelveld"></canvas>
      <p class="hint">Beweeg met ← → of A D, spring met spatie.</p>
    </main>
    <script src="game.js"></script>
  </body>
</html>
